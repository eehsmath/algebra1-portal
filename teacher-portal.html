<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teacher Progress Report — EEHS Math</title>
<style>
  :root{
    --bg:#eef3ff; --panel:#fff; --ui:#dfe6ff; --ink:#0f2340; --muted:#5b6f96;
    --blue:#2f6cff; --vio:#8e78ff; --teal:#36c2a0; --gold:#f4a531;
    --ok:#0b6b2f; --shadow:0 8px 20px rgba(25,40,80,.06);
  }
  *{box-sizing:border-box}
  html,body{min-height:100dvh}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:auto;
    font-family:ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .wrap{width:min(1320px,100%); margin:18px auto; padding:0 12px;}

  /* ---------- header (same shape as the student hub) ---------- */
  .hdr{background:var(--panel); border:1px solid var(--ui); border-radius:18px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px;}
  .hdr .toprow{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap}
  .hdr h1{margin:0; font-size:clamp(22px,3.4vw,30px); font-weight:900; letter-spacing:.2px}
  .hdr .sub{color:var(--muted); font-weight:700; font-size:14px; margin-top:4px}
  .pills{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center}
  .pill{display:inline-block; padding:7px 14px; border-radius:999px; border:1px solid var(--ui); background:#fff; font-weight:900; font-size:14px}
  .pill b{color:var(--blue)}
  .btn{height:40px; border-radius:12px; border:1px solid var(--ui); background:#fff; font-weight:900; padding:0 14px; cursor:pointer; font-family:inherit; font-size:14px; color:var(--ink)}
  .btn.primary{border:0; background:linear-gradient(90deg,var(--blue),var(--teal)); color:#081635}
  .btn.info{border:0; background:linear-gradient(90deg,#cfe0ff,#9bb9ff); color:#081635}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible, select:focus-visible, input:focus-visible{outline:3px solid #59c6ff; outline-offset:2px}

  .card{background:var(--panel); border:1px solid var(--ui); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin-bottom:14px}

  /* ---------- filter bar ---------- */
  .filterBar{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
  /* The three inputs carried hard min-widths (200/170/170) and the tab group is
     inline-flex, so the row had a minimum width nothing could give ground on.
     Three tabs happened to fit; the fourth pushed the row past the page and the
     whole document went wide, which reads as the report "shifted right".
     Letting the fields shrink and the tab group wrap removes the floor entirely,
     so the row can no longer widen the page no matter how many tabs exist. */
  .filterBar > .field{flex:1 1 170px; min-width:0}
  .filterBar > .field input, .filterBar > .field select{min-width:0; width:100%}
  .field{display:flex; flex-direction:column; gap:5px}
  .field label{font-size:11px; font-weight:900; letter-spacing:.6px; color:var(--muted); text-transform:uppercase}
  .field input, .field select{
    height:40px; border:2px solid var(--ui); border-radius:10px; padding:0 12px;
    font:800 13.5px/1 inherit; color:var(--ink); background:#fff; min-width:170px;
  }
  .field input{min-width:200px}
  /* flex-wrap + max-width so the group can never push the filter row wider
     than the page: with four tabs it no longer fits beside the three
     min-width inputs on a narrower window, and inline-flex alone would
     overflow rather than wrap. */
  .viewSwitch{display:inline-flex; flex-wrap:wrap; max-width:100%; gap:4px; padding:4px; background:#eef3ff; border:1px solid var(--ui); border-radius:12px}
  .viewBtn{border:0; background:transparent; font-family:inherit; font-weight:900; font-size:13px; color:var(--muted); padding:9px 14px; border-radius:8px; cursor:pointer; white-space:nowrap}
  .viewBtn:hover{color:var(--ink)}
  .viewBtn.is-active{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(25,40,80,.1)}
  .viewCaption{color:var(--muted); font-size:12.5px; font-weight:700; margin:10px 0 0}

  /* ---------- quick stat cards ---------- */
  .statRow{display:flex; gap:10px; flex-wrap:wrap}
  .statCard{flex:1; min-width:150px; background:#f7f9ff; border:1px solid var(--ui); border-radius:14px; padding:12px 14px}
  .statCard .n{font-size:22px; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums}
  .statCard .l{font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:2px}

  /* ---------- table ---------- */
  .warnBanner{
    background:#fff8e8; border:1px solid #ffe38a; color:#7a5a00; font-weight:800; font-size:12.5px;
    border-radius:10px; padding:8px 12px; margin-bottom:12px;
  }
  .tableWrap{overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:820px}
  th{
    text-align:left; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted);
    padding:9px 10px; border-bottom:2px solid #edf2ff; white-space:nowrap; cursor:pointer; user-select:none;
  }
  th:hover{color:var(--ink)}
  th.active{color:var(--blue)}
  th .arrow{font-size:9px; margin-left:3px}
  td{padding:9px 10px; border-bottom:1px solid #f1f5ff; font-weight:800}
  td.num{font-variant-numeric:tabular-nums}
  td.muted{color:var(--muted); font-weight:700}
  tr.rosterRow:hover td{background:#f8faff}
  tr.stdRow td:first-child{border-left:3px solid var(--vio)}

  .mbarWrap{display:flex; align-items:center; gap:8px}
  .mbar{height:6px; border-radius:999px; background:#edf2ff; overflow:hidden; width:70px; flex:none}
  .mbar i{display:block; height:100%; border-radius:999px; background:var(--blue)}

  /* ---------- per-row expand/collapse (Summary view only) ---------- */
  th.expandHead{cursor:default}
  td.expandCell{text-align:center; padding:6px 10px}
  .expandBtn{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--ui); background:#fff;
    font-family:inherit; font-weight:900; font-size:15px; line-height:1; color:var(--blue); cursor:pointer;
  }
  .expandBtn:hover{background:#eef4ff; border-color:#c3d0ff}
  .expandBtn.is-open{background:var(--blue); border-color:var(--blue); color:#fff}
  tr.expandRow td{background:#f7f9ff; border-bottom:1px solid #e5edff; padding:10px 14px 14px}
  .miniDetailTable{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px}
  .miniDetailTable th{
    font-size:10px; padding:6px 8px; border-bottom:1px solid #dfe6ff; cursor:default; white-space:nowrap;
  }
  .miniDetailTable td{padding:6px 8px; border-bottom:1px solid #eef2ff; font-weight:800}
  .miniDetailEmpty{color:var(--muted); font-weight:700; font-size:12.5px; padding:4px 2px}
  .miniPracticeBlock{background:#f5f2ff; border:1px solid #e0d6ff; border-radius:10px; padding:9px 12px; margin-bottom:8px}
  .miniPracticeRow{font-size:12.5px; font-weight:800}
  .miniPracticeRow + .miniPracticeRow{margin-top:6px}
  .miniLabel{display:inline-block; min-width:96px; font-size:10px; font-weight:900; letter-spacing:.5px; text-transform:uppercase; color:var(--vio)}
  .testCode{
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px;
    background:#f2f5fc; border:1px solid var(--ui); border-radius:6px; padding:2px 7px;
    letter-spacing:.3px; user-select:all;
  }
  .copyCodeBtn{
    height:24px; border-radius:7px; border:1px solid var(--ui); background:#fff;
    font-family:inherit; font-weight:900; font-size:11.5px; padding:0 9px; cursor:pointer; color:var(--blue);
  }
  .copyCodeBtn:hover{background:#eef4ff; border-color:#c3d0ff}
  .clearItemBtn{
    width:24px; height:24px; border-radius:7px; border:1px solid #f3c9c9; background:#fff;
    font-family:inherit; font-weight:900; font-size:14px; line-height:1; color:#c23a3a; cursor:pointer;
  }
  .clearItemBtn:hover{background:#fff0f0; border-color:#e59a9a}
  .clearItemBtn[disabled]{opacity:.5; cursor:default}

  .chip-ok{color:var(--ok); background:#eafff2; border:1px solid #bfeacc; border-radius:999px; padding:3px 10px; font-size:11.5px; font-weight:900; white-space:nowrap}
  .chip-prog{color:#7a5a00; background:#fff9d6; border:1px solid #ffe38a; border-radius:999px; padding:3px 10px; font-size:11.5px; font-weight:900; white-space:nowrap}
  .chip-none{color:var(--muted); background:#f2f5fc; border:1px solid var(--ui); border-radius:999px; padding:3px 10px; font-size:11.5px; font-weight:900; white-space:nowrap}
  .warnDot{display:inline-block; width:7px; height:7px; border-radius:50%; background:#e5484d; margin-left:6px; vertical-align:2px; cursor:help}

  .state{padding:46px 20px; text-align:center; color:var(--muted); font-weight:700}
  .chooserPrompt{padding:64px 20px; text-align:center}
  .chooserPrompt h2{margin:0 0 10px; font-size:23px; font-weight:900; color:var(--ink)}
  .chooserPrompt p{margin:0; color:var(--muted); font-weight:700; font-size:14.5px}
  .state.err{color:#b21f2d}
  .state h3{color:var(--ink); margin:0 0 6px; font-size:17px}

  .foot{color:var(--muted); font-size:12px; font-weight:700; margin-top:8px; text-align:center}

  @media (max-width:700px){
    .filterBar{flex-direction:column; align-items:stretch}
    .field select, .field input{min-width:0; width:100%}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="toprow">
      <div>
        <h1>Teacher Progress Report</h1>
        <div class="sub">Whole-roster view, read live from the student sync sheet — no login, everyone with this link can see it.</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn" id="refreshBtn">&#8635; Refresh</button>
        <button class="btn info" id="csvBtn">Download CSV</button>
      </div>
    </div>
    <div class="pills" id="pillsRow"></div>
    <div class="viewSwitch" id="subjectSwitch" role="tablist" aria-label="Subject" style="margin-top:10px">
      <button class="viewBtn is-active" data-subject="algebra" role="tab">Algebra 1</button>
      <button class="viewBtn" data-subject="tsi" role="tab">TSI</button>
    </div>
  </div>

  <div class="card" id="filterCard" style="display:none">
    <div class="filterBar">
      <div class="field">
        <label for="qInput">Search</label>
        <input id="qInput" placeholder="Student name or ID…" autocomplete="off" />
      </div>
      <div class="field">
        <label for="teacherSel">Teacher</label>
        <select id="teacherSel"></select>
      </div>
      <div class="field">
        <label for="classSel">Class period</label>
        <select id="classSel"></select>
      </div>
      <div class="field">
        <label for="activitySel" title="Active = practice or test activity in the last 3 hours">Show</label>
        <select id="activitySel" title="Active = practice or test activity in the last 3 hours">
          <option value="" selected>Choose…</option>
          <option value="active">Active now</option>
          <option value="all">All students</option>
        </select>
      </div>
      <div style="flex:1"></div>
      <div class="viewSwitch" role="tablist" aria-label="Report view">
        <button class="viewBtn is-active" data-view="summary" role="tab">Summary</button>
        <button class="viewBtn" data-view="detail" role="tab">Detail</button>
        <button class="viewBtn" data-view="crc" role="tab" id="crcTab" style="display:none">Practice tests</button>
      </div>
    </div>
    <div class="viewCaption" id="viewCaption"></div>
    <div class="viewSwitch" id="detailModeSwitch" role="tablist" aria-label="Detail layout" style="display:none; margin-top:8px">
      <button class="viewBtn is-active" data-detail-mode="grouped" role="tab">Grouped by student</button>
      <button class="viewBtn" data-detail-mode="flat" role="tab">Flat (sort by standard)</button>
    </div>
  </div>

  <div class="card" id="statCardWrap" style="display:none">
    <div class="statRow" id="statRow"></div>
  </div>

  <div class="card" id="tableCard">
    <div id="stateArea"></div>
    <div id="warnBanner"></div>
    <div class="tableWrap" id="tableWrap" style="display:none">
      <table>
        <thead id="repHead"></thead>
        <tbody id="repRows"></tbody>
      </table>
    </div>
  </div>

  <div class="foot">Click any column header to sort by it. Standards with zero attempts are left out of the Detail view, same as the student-side report.</div>
</div>

<script src="portal.js?v=20260913b"></script>
<script src="https://eehsmath.github.io/tsi-portal/portal-tsi.js?v=20260913c"></script>
<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pct(x){ return Math.round((x||0)*100)+'%'; }
  function fmtDate(ms){
    if (!ms) return '—';
    var d = new Date(ms), y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'),
        day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }

  /* =====================================================================
     CONFIG — this is the SAME Apps Script URL as SYNC_URL in portal.js
     (the report is a ?report=all branch added directly into Code.gs's
     existing doGet, not a separate deployment). Paste the same /exec URL
     here. This page must sit next to portal.js (same folder as
     index.html) so the <script src="portal.js"> tag below resolves.
     ===================================================================== */
  var REPORT_URL = 'https://script.google.com/macros/s/AKfycbwvP9DR8ZfNloUR0Mn1IogfjyPB1kZKTP_ss1o8-sivIY2EYCIR9WBOoY5aX8qHRLnrCQ/exec';

  var PORTALS = {
    algebra: { key: 'algebra', label: 'Algebra 1', api: Portal,
               ready: Portal.REGISTRY.filter(function(r){ return r.status === 'ready'; }) },
    tsi:     { key: 'tsi',     label: 'TSI',       api: TSIPortal,
               ready: TSIPortal.REGISTRY.filter(function(r){ return r.status === 'ready'; }) }
  };
  var subject = 'algebra';          // 'algebra' | 'tsi' — which registry/API drives every rollup below
  function activePortal(){ return PORTALS[subject]; }

  var expandedIds = {};   // student id -> true while its Summary row is expanded inline

  var studentsBySubject = { algebra: null, tsi: null };  // cache: null = not fetched yet for that tab
  var raw = [];               // current subject's students, with rollups already attached
  var view = 'summary';       // 'summary' | 'detail' | 'crc'  (crc is TSI-only)
  var sortState = { summary: {key:'name', dir:1}, detail: {key:'name', dir:1}, crc: {key:'score', dir:-1} };

  var VIEW_CAPTIONS = {
    summary: 'One row per student — overall roll-up across every standard. Click the <b>+</b> at the end of a row to spot-check that one student\u2019s per-standard detail without leaving Summary; click it again to collapse. Switch to Detail to see every student\u2019s breakdown at once instead.',
    detail:  'One row per student per standard they\u2019ve started \u2014 sort by \u201cStandard\u201d to compare the whole filtered group on one topic at a time.',
    crc:     'One row per student with practice-test activity. <b>Only finished tests are counted</b> \u2014 a test still in progress shows as a chip and adds nothing to Raw or the strand columns until the student completes it. These numbers stay separate from Mastered/Progress on purpose: the test targets roughly 50% difficulty, so folding it into standards mastery would understate what students know. Sort by <b>Weakest</b> or a strand column to group students who need the same reteach. A <b>*</b> marks older records where the count may include unfinished work.'
  };

  /* ---------------- data shaping ---------------- */

  function normalizeData(d){
    if (!d || typeof d !== 'object') return {skills:{}};
    if (!d.skills || typeof d.skills !== 'object') d.skills = {};
    return d;
  }

  /* One student's roll-up across every READY standard — same math as the
     student-side report (Portal.totals()), just parameterized over an
     explicit data blob instead of always reading this device's own. */
  function overallFor(d){
    var p = activePortal();
    var a=0, c=0, mastered=0, progSum=0, hints=0, last=0;
    p.ready.forEach(function(r){
      var st = p.api.statsForD(d, r);
      a += st.attempts; c += st.correct;
      if (st.mastered) mastered += 1;
      progSum += st.progress; hints += st.hints;
      if (st.last > last) last = st.last;
    });
    return {
      attempts:a, correct:c, mastered:mastered, total:p.ready.length,
      progress: p.ready.length ? progSum/p.ready.length : 0,
      hints:hints, last:last, accuracy: a ? c/a : 0
    };
  }

  /* Recompute every loaded student's rollup for whichever subject is active.
     Cheap (pure in-memory math over already-fetched data), so this runs on
     every subject-toggle click with no refetch. */
  function recomputeOverall(){
    raw.forEach(function(s){
      s.overall = overallFor(s.d);
      /* TSI only — the Algebra 1 portal has no adaptive practice test. */
      s.crc = (subject === 'tsi') ? crcFor(s.d) : null;
    });
  }

  function loadStudents(portalKey, list){
    var processed = list.map(function(s){
      var d = normalizeData(s.data);
      return {
        id: s.id, name: s.name || '', teacher: s.teacher || '',
        klass: (s['class'] != null ? s['class'] : '') || '',
        updated: s.updated || '', parseError: !!s.parseError,
        d: d
      };
    });
    studentsBySubject[portalKey] = processed;
    if (subject !== portalKey) return;   // user switched away before this fetch landed — cache it, don't render it
    raw = processed;
    recomputeOverall();
    buildFilterOptions();
    renderAll();
  }

  /* ---------------- filters ---------------- */

  function optionCounts(field){
    var m = {};
    raw.forEach(function(s){ var v = s[field] || '(unassigned)'; m[v] = (m[v]||0) + 1; });
    return m;
  }
  function buildFilterOptions(){
    [['teacherSel','teacher','All teachers'], ['classSel','klass','All periods']].forEach(function(spec){
      var sel = $('#'+spec[0]), field = spec[1], allLabel = spec[2];
      var counts = optionCounts(field);
      var keys = Object.keys(counts).sort();
      var cur = sel.value;
      sel.innerHTML = '<option value="">'+allLabel+' ('+raw.length+')</option>' +
        keys.map(function(k){ return '<option value="'+esc(k)+'">'+esc(k)+' ('+counts[k]+')</option>'; }).join('');
      if (keys.indexOf(cur) !== -1) sel.value = cur;
    });
  }
  /* Nothing renders until the teacher actually picks something — with a
     couple hundred students, a default list (even "active only") turned out
     to still not be the useful starting point in the classroom. hasChosen()
     is the single gate render() checks before showing the table at all;
     typing a search or picking Teacher/Class counts as choosing, same as
     explicitly picking a Show option. */
  function hasChosen(){
    return !!($('#qInput').value || '').trim() || !!$('#teacherSel').value ||
           !!$('#classSel').value || !!$('#activitySel').value;
  }
  /* Most recent of standards-practice activity and (TSI) CRC test activity,
     since a student mid-practice-test wouldn't show as active by
     standards-practice timestamps alone — exactly the moment "Active now"
     needs to catch during a testing session. */
  var ACTIVE_WINDOW_HOURS = 3;
  function lastActiveTs(s){
    return Math.max(s.overall.last || 0, (s.crc && s.crc.last) || 0);
  }
  function filteredStudents(){
    var q = ($('#qInput').value || '').trim().toLowerCase();
    var t = $('#teacherSel').value, c = $('#classSel').value;
    var activeOnly = $('#activitySel').value === 'active';
    var cutoff = Date.now() - ACTIVE_WINDOW_HOURS * 3600000;
    return raw.filter(function(s){
      if (t && (s.teacher || '(unassigned)') !== t) return false;
      if (c && (s.klass || '(unassigned)') !== c) return false;
      if (q && s.name.toLowerCase().indexOf(q) === -1 && String(s.id).indexOf(q) === -1) return false;
      if (activeOnly && !q && !t && !c && lastActiveTs(s) < cutoff) return false;
      return true;
    });
  }

  /* ---------------- sorting ---------------- */

  function sortRows(rows, dir, get){
    rows.sort(function(a,b){
      var va = get(a), vb = get(b);
      if (typeof va === 'string'){ va = va.toLowerCase(); vb = vb.toLowerCase(); }
      if (va < vb) return -1*dir;
      if (va > vb) return 1*dir;
      return 0;
    });
    return rows;
  }

  /* ---------------- column models ---------------- */

  /* ===================================================================
     ADAPTIVE PRACTICE TEST (TSI only)
     -------------------------------------------------------------------
     These results deliberately live OUTSIDE the registry: the test targets
     roughly 50% difficulty by design, so folding it into mastery would drag
     every standard's recent-accuracy down. That is why nothing below ever
     touches overallFor() — the two sets of numbers stay separate on purpose.

     Two sources, because older records only have the first:
       skills['CRC.TEST']  — tests taken, tests passed, and `lv`, a 1-5 score
                             BAND. Always present once a test is finished.
       data.tests[]        — the full per-attempt log with exact scores and
                             dates. Only present for tests synced after the
                             Apps Script mergeData_ fix; earlier attempts had
                             this stripped at the server, so we fall back to
                             the band and report a range instead of a number.
     =================================================================== */
  var CRC_STRANDS = [
    { key:'AR',  id:'CRC.AR'  }, { key:'QR',  id:'CRC.QR'  },
    { key:'PSR', id:'CRC.PSR' }, { key:'GSR', id:'CRC.GSR' }
  ];

  var RESUME_MAX_AGE_DAYS = 14;   // must match getResume() in portal-tsi.js

  /* An unfinished test in the resume slot. Not counted anywhere — shown as its
     own "in progress" state so a teacher can see who is mid-test without that
     work inflating anyone's totals. Mirrors the client's expiry rule so a
     lapsed test stops showing here too, even before the student next loads
     the hub and it gets reaped for real. */
  function openTestFor(d){
    var r = d && d.resume;
    if (!r || r.cleared || !r.at) return null;
    if ((Date.now() - r.at) > RESUME_MAX_AGE_DAYS * 86400000) return null;
    var n = r.n || (Array.isArray(r.picks) ? r.picks.length : 0);
    if (!n) return null;
    return { answered: n, at: r.at };
  }

  function crcFor(d){
    d = d || {};
    var skills = d.skills || {};
    var t = skills['CRC.TEST'];
    var log = Array.isArray(d.tests) ? d.tests.slice().sort(function(x,y){ return (x.t||0)-(y.t||0); }) : [];
    var open = openTestFor(d);

    /* Counts come from the per-attempt log when we have it, because that is
       finished tests only, by construction. Records from before the sync fix
       have no log, so we fall back to the CRC.* counters and mark them — those
       may still include questions from tests that were never finished. */
    var strands = {}, items = 0, correct = 0, weakest = null, last = 0, estimated = false;

    if (log.length){
      CRC_STRANDS.forEach(function(c){ strands[c.key] = { c:0, n:0, acc:0 }; });
      log.forEach(function(e){
        var st = e.s || {};
        CRC_STRANDS.forEach(function(c){
          var pair = st[c.key];
          if (!pair) return;
          strands[c.key].c += (pair[0] || 0);
          strands[c.key].n += (pair[1] || 0);
        });
        if (e.t > last) last = e.t;
      });
      CRC_STRANDS.forEach(function(c){
        var v = strands[c.key];
        if (!v.n) { strands[c.key] = null; return; }
        v.acc = v.c / v.n; items += v.n; correct += v.c;
        if (!weakest || v.acc < weakest.acc) weakest = { key: c.key, acc: v.acc };
      });
    } else {
      estimated = true;
      CRC_STRANDS.forEach(function(c){
        var sk = skills[c.id];
        if (!sk || !sk.a) { strands[c.key] = null; return; }
        strands[c.key] = { c: sk.c, n: sk.a, acc: sk.c / sk.a };
        items += sk.a; correct += sk.c;
        if (sk.t > last) last = sk.t;
        if (!weakest || (sk.c/sk.a) < weakest.acc) weakest = { key: c.key, acc: sk.c/sk.a };
      });
    }

    if (!t && !items && !open) return null;        // no practice-test activity at all
    if (t && t.t > last) last = t.t;
    if (open && open.at > last) last = open.at;

    var taken  = t ? t.a : 0;
    var passed = t ? t.c : 0;
    var exact  = log.length ? log[log.length-1].score : null;
    var best   = log.length ? Math.max.apply(null, log.map(function(e){ return e.score; })) : null;
    var first  = log.length ? log[0].score : null;
    var band   = t ? (t.lv || 1) : null;

    return {
      taken: taken, passed: passed, log: log,
      exact: exact, best: best,
      gain: (log.length > 1) ? (exact - first) : null,
      band: band,
      lo: band ? Math.max(910, Math.round(910 + (band-1.5)*20)) : null,
      hi: band ? Math.min(990, Math.round(910 + (band-0.5)*20)) : null,
      strands: strands, items: items, correct: correct,
      open: open, estimated: estimated && items > 0,
      weakest: weakest, last: last
    };
  }

  /* Score cell: an exact number when we have the log, otherwise the band range
     with a marker, so a teacher can tell a measurement from an estimate. */
  function crcScoreCell(x){
    if (x.exact != null){
      return '<b>'+x.exact+'</b>' + (x.best != null && x.best !== x.exact ? ' <span class="muted">(best '+x.best+')</span>' : '');
    }
    if (x.lo != null) return '<span title="Exact score was lost before the sync fix — this is the stored 1-5 band">'+x.lo+'\u2013'+x.hi+' <span class="muted">est.</span></span>';
    return '\u2014';
  }

  function crcStrandCell(v){
    if (!v) return '<td class="num muted">\u2014</td>';
    var tone = v.acc >= 0.8 ? 'var(--ok)' : (v.acc < 0.5 ? 'var(--err)' : 'inherit');
    return '<td class="num" style="color:'+tone+'">'+v.c+'/'+v.n+'</td>';
  }

  var CRC_COLS = [
    {key:'name',    label:'Student',   get:function(s){ return s.name || '(no name)'; }},
    {key:'id',      label:'ID',        get:function(s){ return s.id; }},
    {key:'teacher', label:'Teacher',   get:function(s){ return s.teacher || '\u2014'; }},
    {key:'klass',   label:'Period',    get:function(s){ return s.klass || '\u2014'; }},
    {key:'taken',   label:'Tests',     get:function(s){ return s.crc ? s.crc.taken : -1; }},
    {key:'passed',  label:'\u2265950',get:function(s){ return s.crc ? s.crc.passed : -1; }},
    {key:'score',   label:'Score',     get:function(s){ return s.crc ? (s.crc.exact != null ? s.crc.exact : (s.crc.lo || 0)) : -1; }},
    {key:'raw',     label:'Raw',       get:function(s){ return s.crc && s.crc.items ? s.crc.correct/s.crc.items : -1; }},
    {key:'ar',      label:'AR',        get:function(s){ return s.crc && s.crc.strands.AR  ? s.crc.strands.AR.acc  : -1; }},
    {key:'qr',      label:'QR',        get:function(s){ return s.crc && s.crc.strands.QR  ? s.crc.strands.QR.acc  : -1; }},
    {key:'psr',     label:'PSR',       get:function(s){ return s.crc && s.crc.strands.PSR ? s.crc.strands.PSR.acc : -1; }},
    {key:'gsr',     label:'GSR',       get:function(s){ return s.crc && s.crc.strands.GSR ? s.crc.strands.GSR.acc : -1; }},
    {key:'weak',    label:'Weakest',   get:function(s){ return s.crc && s.crc.weakest ? s.crc.weakest.key : ''; }},
    {key:'last',    label:'Last Test', get:function(s){ return s.crc ? s.crc.last : 0; }}
  ];

  function renderCrcRows(rows){
    rows = rows.filter(function(s){ return !!s.crc; });
    if (!rows.length) return '<tr><td colspan="'+(CRC_COLS.length+1)+'" style="color:var(--muted)">'+
      'No practice-test activity for these filters yet.</td></tr>';
    return rows.map(function(s){
      var x = s.crc;
      var progress = x.open
        ? '<span class="chip-prog" title="Answered '+x.open.answered+' of 20. Not counted until they finish.">in progress '+x.open.answered+'/20</span>'
        : '';
      var scoreCell = x.taken ? crcScoreCell(x)
                    : (x.open ? progress : '<span class="muted">—</span>');
      var crcId = 'crc:'+s.id;
      var isOpen = !!expandedIds[crcId];
      var who = esc(s.name || 'this student');
      var mainRow = '<tr class="rosterRow">'+
        '<td>'+esc(s.name || '(no name)')+(x.taken && x.open ? ' '+progress : '')+'</td>'+
        '<td>'+esc(s.id)+'</td>'+
        '<td>'+esc(s.teacher || '—')+'</td>'+
        '<td>'+esc(s.klass || '—')+'</td>'+
        '<td class="num'+(x.taken?'':' muted')+'">'+(x.taken||0)+'</td>'+
        '<td class="num'+(x.taken?'':' muted')+'">'+(x.taken ? x.passed : '—')+'</td>'+
        '<td class="num">'+scoreCell+'</td>'+
        '<td class="num">'+(x.items ? x.correct+'/'+x.items+(x.estimated?' <span class="muted" title="From before the sync fix — may include questions from tests that were never finished">*</span>':'') : '—')+'</td>'+
        CRC_STRANDS.map(function(c){ return crcStrandCell(x.strands[c.key]); }).join('')+
        '<td>'+(x.weakest ? '<b>'+x.weakest.key+'</b> <span class="muted">'+Math.round(x.weakest.acc*100)+'%</span>' : '—')+'</td>'+
        '<td class="num muted">'+fmtDate(x.last)+'</td>'+
        '<td class="expandCell"><button type="button" class="expandBtn'+(isOpen?' is-open':'')+'" '+
          'data-id="'+esc(crcId)+'" aria-expanded="'+(isOpen?'true':'false')+'" '+
          'title="'+(isOpen?'Collapse':'Show')+' '+who+'’s test codes">'+(isOpen?'−':'+')+'</button></td>'+
      '</tr>';
      if (!isOpen) return mainRow;
      return mainRow + '<tr class="expandRow" data-expand-for="'+esc(crcId)+'">'+
        '<td colspan="'+(CRC_COLS.length+1)+'">'+crcDetailHTML(s)+'</td></tr>';
    }).join('');
  }

  /* Per-student list of finished CRC attempts with their resume/review codes,
     newest first, each with a one-click copy so a teacher can pull a specific
     test back up without retyping a 6-character code by hand. */
  function crcDetailHTML(s){
    var log = (s.crc && s.crc.log) || [];
    if (!log.length) return '<div class="miniDetailEmpty">No finished practice tests logged for this student yet.</div>';
    var body = log.slice().reverse().map(function(e){
      var code = e.code || '';
      return '<tr>'+
        '<td class="num muted">'+fmtDate(e.t)+'</td>'+
        '<td class="num">'+(e.score != null ? e.score : '—')+'</td>'+
        '<td>'+(e.ready ? '<span class="chip-ok">Ready ✓</span>' : '<span class="chip-prog">Not yet</span>')+'</td>'+
        '<td class="num">'+(e.right!=null && e.n!=null ? e.right+'/'+e.n : '—')+'</td>'+
        '<td>'+(code ? '<span class="testCode">'+esc(code)+'</span>' : '<span class="muted">—</span>')+'</td>'+
        '<td>'+(code ? '<button type="button" class="copyCodeBtn" data-code="'+esc(code)+'">Copy</button>' : '')+'</td>'+
        '<td class="expandCell"><button type="button" class="clearItemBtn" title="Delete this test attempt" '+
          'data-student="'+esc(s.id)+'" data-kind="test" data-key="'+esc(e.t)+'" data-label="the '+fmtDate(e.t)+' test">×</button></td>'+
      '</tr>';
    }).join('');
    return '<table class="miniDetailTable"><thead><tr>'+
      '<th>Date</th><th>Score</th><th>Result</th><th>Raw</th><th>Test code</th><th></th><th></th>'+
      '</tr></thead><tbody>'+body+'</tbody></table>';
  }

  var SUMMARY_COLS = [
    {key:'name',     label:'Student',     get:function(s){ return s.name || '(no name)'; }},
    {key:'id',       label:'ID',          get:function(s){ return s.id; }},
    {key:'teacher',  label:'Teacher',     get:function(s){ return s.teacher || '\u2014'; }},
    {key:'klass',    label:'Period',      get:function(s){ return s.klass || '\u2014'; }},
    {key:'mastered', label:'Mastered',    get:function(s){ return s.overall.mastered; }},
    {key:'progress', label:'Progress',    get:function(s){ return s.overall.progress; }},
    {key:'attempts', label:'Attempts',    get:function(s){ return s.overall.attempts; }},
    {key:'accuracy', label:'Accuracy',    get:function(s){ return s.overall.accuracy; }},
    {key:'hints',    label:'Hints',       get:function(s){ return s.overall.hints; }},
    {key:'last',     label:'Last Active', get:function(s){ return s.overall.last; }}
  ];

  /* TSI-only receipt column — just "did they take it and what did they get,"
     no mastery math, so it stays out of SUMMARY_COLS proper and only gets
     appended when subject is 'tsi' (Algebra 1 has no CRC test to show). */
  var CRC_SUMMARY_COL = {key:'crcTest', label:'Practice Test',
    get:function(s){
      if (!s.crc) return -4;
      if (s.crc.exact != null) return s.crc.exact;
      if (s.crc.taken) return s.crc.lo || -1;
      if (s.crc.open) return -2;
      return -3;
    }};
  function summaryCols(){
    return (subject === 'tsi') ? SUMMARY_COLS.concat([CRC_SUMMARY_COL]) : SUMMARY_COLS;
  }
  /* Every finished score, not just the latest + a count — "950 ×2" told you
     there were two tests but not whether the other one was a 910 or a 990. */
  function crcScoreList(x){
    if (x.log && x.log.length){
      return x.log.map(function(e){
        return e.score >= 950 ? '<b style="color:var(--ok)">'+e.score+'</b>' : String(e.score);
      }).join(', ');
    }
    return crcScoreCell(x);   // pre-sync-fix record: no per-attempt log, just the band
  }
  function crcSummaryCell(s){
    var x = s.crc;
    if (!x) return '<td class="num muted">—</td>';
    if (x.taken) return '<td class="num">'+crcScoreList(x)+'</td>';
    if (x.open) return '<td class="num"><span class="chip-prog" title="Answered '+x.open.answered+' of 20. Not counted until they finish.">in progress '+x.open.answered+'/20</span></td>';
    return '<td class="num muted">—</td>';
  }

  var DETAIL_COLS = [
    {key:'name',      label:'Student',     get:function(r){ return r.name || '(no name)'; }},
    {key:'teacher',   label:'Teacher',     get:function(r){ return r.teacher || '\u2014'; }},
    {key:'klass',     label:'Period',      get:function(r){ return r.klass || '\u2014'; }},
    {key:'std',       label:'Standard',    get:function(r){ return r.stdCode; }},
    {key:'progress',  label:'Progress',    get:function(r){ return r.st.progress; }},
    {key:'mastered',  label:'Mastered',    get:function(r){ return r.st.mastered ? 1 : 0; }},
    {key:'attempts',  label:'Attempts',    get:function(r){ return r.st.attempts; }},
    {key:'correct',   label:'Correct',     get:function(r){ return r.st.correct; }},
    {key:'recentAcc', label:'Recent 10',   get:function(r){ return r.st.recentAcc; }},
    {key:'hints',     label:'Hints',       get:function(r){ return r.st.hints; }},
    {key:'last',      label:'Last Active', get:function(r){ return r.st.last; }}
  ];

  function flattenDetail(students){
    var p = activePortal();
    var out = [];
    students.forEach(function(s){
      p.ready.forEach(function(r){
        var st = p.api.statsForD(s.d, r);
        if (!st.attempts) return;   // matches the student-side report's own "skip untouched standards" rule
        out.push({name:s.name, id:s.id, teacher:s.teacher, klass:s.klass,
          stdCode:(r.code||r.id), stdId:r.id, stdName:r.name, st:st});
      });
    });
    return out;
  }

  /* Detail has two layouts sharing one dataset: flat (DETAIL_COLS, sortable
     by Standard across every student at once) and grouped (one collapsed
     row per student, click to expand — same interaction as Summary). Grouped
     has nothing standard-shaped to sort by, so it gets its own column set. */
  var detailGrouped = true;
  var GROUPED_DETAIL_COLS = [
    {key:'name',    label:'Student', get:function(g){ return g.name || '(no name)'; }},
    {key:'id',      label:'ID',      get:function(g){ return g.id; }},
    {key:'teacher', label:'Teacher', get:function(g){ return g.teacher || '—'; }},
    {key:'klass',   label:'Period',  get:function(g){ return g.klass || '—'; }},
    {key:'count',   label:'Standards Started', get:function(g){ return g.rows.length; }}
  ];
  function groupedDetailRows(students){
    var byId = {};
    flattenDetail(students).forEach(function(r){
      var g = byId[r.id];
      if (!g) g = byId[r.id] = {id:r.id, name:r.name, teacher:r.teacher, klass:r.klass, rows:[]};
      g.rows.push(r);
    });
    return Object.keys(byId).map(function(id){ return byId[id]; });
  }

  /* ---------------- rendering ---------------- */

  function statusChip(mastered, attempts){
    if (!attempts) return '<span class="chip-none">Not started</span>';
    if (mastered) return '<span class="chip-ok">Mastered \u2713</span>';
    return '<span class="chip-prog">In progress</span>';
  }
  function barCell(p){
    return '<div class="mbarWrap"><div class="mbar"><i style="width:'+Math.round(p*100)+'%"></i></div>'+pct(p)+'</div>';
  }

  function renderHead(cols, activeKey, dir, extraCellHTML){
    return '<tr>' + cols.map(function(c){
      var isActive = c.key === activeKey;
      return '<th data-key="'+c.key+'" class="'+(isActive?'active':'')+'">'+esc(c.label)+
        (isActive ? '<span class="arrow">'+(dir===1?'\u25B2':'\u25BC')+'</span>' : '') + '</th>';
    }).join('') + (extraCellHTML || '') + '</tr>';
  }

  /* Which REGISTRY section a CRC strand's weak result should point a
     recommendation at — CRC.AR lives in the 'alg' section, etc. */
  var SEC_FOR_CRC_STRAND = { AR:'alg', QR:'quant', GSR:'geo', PSR:'prob' };

  /* First not-yet-mastered ready standard, optionally scoped to one section.
     Same rule as portal-tsi.js's own nextOnPath(), just parameterized over
     an explicit data blob (like statsForD) instead of always reading this
     device's own data, and optionally narrowed to a section. */
  function recommendedStandard(d, sec){
    var p = activePortal();
    for (var i = 0; i < p.ready.length; i++){
      var r = p.ready[i];
      if (sec && r.sec !== sec) continue;
      if (!p.api.statsForD(d, r).mastered) return r;
    }
    return null;
  }

  /* Ties the practice test's weakest strand to a concrete standard to study:
     prefer the first unmastered standard in that weak section, falling back
     to the general next-on-path standard if that section is already clear. */
  function practiceRecommendation(s){
    var x = s.crc;
    var weakSec = (x && x.weakest) ? SEC_FOR_CRC_STRAND[x.weakest.key] : null;
    var rec = weakSec ? recommendedStandard(s.d, weakSec) : null;
    var fromWeak = !!rec;
    if (!rec) rec = recommendedStandard(s.d, null);
    return { rec: rec, fromWeak: fromWeak };
  }

  /* Top-of-dropdown "receipt" — practice-test results and a study
     recommendation, visible the instant a teacher expands a row instead of
     needing a trip to the CRC tab. TSI only; Algebra 1 has no CRC test. */
  function practiceTestBlockHTML(s){
    if (subject !== 'tsi') return '';
    var x = s.crc;
    var testsHTML;
    if (x && (x.taken || x.open)){
      var parts = x.taken ? [crcScoreList(x)] : [];
      if (x.open) parts.push('<span class="chip-prog" title="Answered '+x.open.answered+' of 20. Not counted until they finish.">in progress '+x.open.answered+'/20</span>');
      testsHTML = parts.join(' ');
      if (x.weakest) testsHTML += ' <span class="muted">(weakest: <b>'+esc(x.weakest.key)+'</b> '+Math.round(x.weakest.acc*100)+'%)</span>';
    } else {
      testsHTML = '<span class="muted">No practice test activity yet.</span>';
    }

    var rc = practiceRecommendation(s);
    var recHTML = !rc.rec
      ? '<span class="muted">All ready standards mastered — nothing to recommend.</span>'
      : '<b>'+esc(rc.rec.code || rc.rec.id)+'</b> — '+esc(rc.rec.name)+
        (rc.fromWeak ? ' <span class="muted">(their weakest test area)</span>' : '');

    return '<div class="miniPracticeBlock">'+
      '<div class="miniPracticeRow"><span class="miniLabel">Practice test</span>'+testsHTML+'</div>'+
      '<div class="miniPracticeRow"><span class="miniLabel">Study next</span>'+recHTML+'</div>'+
    '</div>';
  }

  /* Per-standard breakdown table for one student's already-flattened rows —
     shared by Summary's dropdown and Detail's grouped-by-student mode so
     both render the exact same table instead of two copies of this markup. */
  function standardsTableHTML(rows){
    if (!rows.length) return '<div class="miniDetailEmpty">No standards modules started yet.</div>';
    var body = rows.map(function(r){
      return '<tr>'+
        '<td><b>'+esc(r.stdCode)+'</b></td>'+
        '<td>'+barCell(r.st.progress)+'</td>'+
        '<td>'+statusChip(r.st.mastered, r.st.attempts)+'</td>'+
        '<td class="num">'+r.st.attempts+'</td>'+
        '<td class="num">'+r.st.correct+'</td>'+
        '<td class="num">'+(r.st.attempts ? pct(r.st.recentAcc) : '\u2014')+'</td>'+
        '<td class="num">'+r.st.hints+'</td>'+
        '<td class="num muted">'+fmtDate(r.st.last)+'</td>'+
        '<td class="expandCell"><button type="button" class="clearItemBtn" title="Delete this module\u2019s data" '+
          'data-student="'+esc(r.id)+'" data-kind="skill" data-key="'+esc(r.stdId)+'" data-label="'+esc(r.stdCode)+'">\u00d7</button></td>'+
      '</tr>';
    }).join('');
    return '<table class="miniDetailTable"><thead><tr>'+
      '<th>Standard</th><th>Progress</th><th>Mastered</th><th>Attempts</th>'+
      '<th>Correct</th><th>Recent 10</th><th>Hints</th><th>Last Active</th><th></th>'+
      '</tr></thead><tbody>'+body+'</tbody></table>';
  }

  /* Compact per-standard breakdown for ONE student, reusing flattenDetail
     scoped to a single-element array — same rollup, no separate math. */
  function miniDetailHTML(s){
    return practiceTestBlockHTML(s) + standardsTableHTML(flattenDetail([s]));
  }

  /* Detail, grouped mode: one collapsed row per student — same expand
     interaction as Summary, keyed 'detail:<id>' so it doesn't collide with
     Summary's own expandedIds entries for the same student. */
  function renderGroupedDetailRows(groups){
    if (!groups.length) return '<tr><td colspan="'+(GROUPED_DETAIL_COLS.length+1)+'" style="color:var(--muted)">No standards modules started yet for these filters.</td></tr>';
    return groups.map(function(g){
      var key = 'detail:'+g.id;
      var isOpen = !!expandedIds[key];
      var who = esc(g.name || 'this student');
      var mainRow = '<tr class="rosterRow">'+
        '<td>'+esc(g.name || '(no name)')+'</td>'+
        '<td class="num muted">'+esc(g.id)+'</td>'+
        '<td>'+esc(g.teacher || '\u2014')+'</td>'+
        '<td>'+esc(g.klass || '\u2014')+'</td>'+
        '<td class="num">'+g.rows.length+'</td>'+
        '<td class="expandCell"><button type="button" class="expandBtn'+(isOpen?' is-open':'')+'" '+
          'data-id="'+esc(key)+'" aria-expanded="'+(isOpen?'true':'false')+'" '+
          'title="'+(isOpen?'Collapse':'Show')+' '+who+'\u2019s per-standard detail">'+(isOpen?'\u2212':'+')+'</button></td>'+
      '</tr>';
      if (!isOpen) return mainRow;
      return mainRow + '<tr class="expandRow" data-expand-for="'+esc(key)+'">'+
        '<td colspan="'+(GROUPED_DETAIL_COLS.length+1)+'">'+standardsTableHTML(g.rows)+'</td></tr>';
    }).join('');
  }

  function renderSummaryRows(rows){
    var cols = summaryCols();
    var isTsi = (subject === 'tsi');
    if (!rows.length) return '<tr><td colspan="'+(cols.length+1)+'" style="color:var(--muted)">No students match these filters.</td></tr>';
    return rows.map(function(s){
      var warn = s.parseError ? '<span class="warnDot" title="Could not read this student\u2019s saved progress data \u2014 shown as zero"></span>' : '';
      var isOpen = !!expandedIds[s.id];
      var who = esc(s.name || 'this student');
      var mainRow = '<tr class="rosterRow">'+
        '<td>'+esc(s.name || '(no name)')+warn+'</td>'+
        '<td class="num muted">'+esc(s.id)+'</td>'+
        '<td>'+esc(s.teacher || '\u2014')+'</td>'+
        '<td>'+esc(s.klass || '\u2014')+'</td>'+
        '<td class="num">'+s.overall.mastered+' / '+s.overall.total+'</td>'+
        '<td class="num">'+barCell(s.overall.progress)+'</td>'+
        '<td class="num">'+s.overall.attempts+'</td>'+
        '<td class="num">'+(s.overall.attempts ? pct(s.overall.accuracy) : '\u2014')+'</td>'+
        '<td class="num">'+s.overall.hints+'</td>'+
        '<td class="num muted">'+fmtDate(s.overall.last)+'</td>'+
        (isTsi ? crcSummaryCell(s) : '')+
        '<td class="expandCell"><button type="button" class="expandBtn'+(isOpen?' is-open':'')+'" '+
          'data-id="'+esc(s.id)+'" aria-expanded="'+(isOpen?'true':'false')+'" '+
          'title="'+(isOpen?'Collapse':'Show')+' '+who+'\u2019s per-standard detail">'+(isOpen?'\u2212':'+')+'</button></td>'+
      '</tr>';
      if (!isOpen) return mainRow;
      return mainRow + '<tr class="expandRow" data-expand-for="'+esc(s.id)+'">'+
        '<td colspan="'+(cols.length+1)+'">'+miniDetailHTML(s)+'</td></tr>';
    }).join('');
  }
  function renderDetailRows(rows){
    if (!rows.length) return '<tr><td colspan="'+DETAIL_COLS.length+'" style="color:var(--muted)">No standards modules started yet for these filters.</td></tr>';
    return rows.map(function(r){
      return '<tr class="rosterRow stdRow">'+
        '<td>'+esc(r.name || '(no name)')+'</td>'+
        '<td>'+esc(r.teacher || '\u2014')+'</td>'+
        '<td>'+esc(r.klass || '\u2014')+'</td>'+
        '<td><b>'+esc(r.stdCode)+'</b></td>'+
        '<td class="num">'+barCell(r.st.progress)+'</td>'+
        '<td>'+statusChip(r.st.mastered, r.st.attempts)+'</td>'+
        '<td class="num">'+r.st.attempts+'</td>'+
        '<td class="num">'+r.st.correct+'</td>'+
        '<td class="num">'+(r.st.attempts ? pct(r.st.recentAcc) : '\u2014')+'</td>'+
        '<td class="num">'+r.st.hints+'</td>'+
        '<td class="num muted">'+fmtDate(r.st.last)+'</td>'+
      '</tr>';
    }).join('');
  }

  function renderStats(students){
    var n = students.length, cards;

    if (view === 'crc'){
      /* The practice test is not standards practice, so the standards tiles
         say nothing useful here. Show what this view is actually about. */
      var tested = 0, tests = 0, passed = 0, inProgress = 0, strandTot = {};
      CRC_STRANDS.forEach(function(c){ strandTot[c.key] = {c:0, n:0}; });
      students.forEach(function(s){
        var x = s.crc; if (!x) return;
        if (x.taken) { tested++; tests += x.taken; passed += x.passed; }
        if (x.open) inProgress++;
        CRC_STRANDS.forEach(function(c){
          var v = x.strands[c.key]; if (!v) return;
          strandTot[c.key].c += v.c; strandTot[c.key].n += v.n;
        });
      });
      var weakest = null;
      CRC_STRANDS.forEach(function(c){
        var v = strandTot[c.key]; if (!v.n) return;
        var acc = v.c / v.n;
        if (!weakest || acc < weakest.acc) weakest = { key:c.key, acc:acc };
      });
      cards = [
        {n: tested, l: 'Students with a finished test'},
        {n: tests,  l: 'Tests completed'},
        {n: tests ? Math.round(passed/tests*100)+'%' : '\u2014', l: 'Tests at or above 950'},
        {n: weakest ? weakest.key + ' ' + Math.round(weakest.acc*100)+'%' : '\u2014', l: 'Weakest strand (group)'}
      ];
      if (inProgress) cards.push({n: inProgress, l: 'Tests in progress'});
      $('#statRow').innerHTML = cards.map(function(c){
        return '<div class="statCard"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div></div>';
      }).join('');
      return;
    }

    var totalAttempts = 0, progSum = 0, masteredSum = 0, testsCount = 0;
    students.forEach(function(s){
      totalAttempts += s.overall.attempts; progSum += s.overall.progress; masteredSum += s.overall.mastered;
      if (s.crc && s.crc.taken) testsCount += s.crc.taken;
    });
    /* Summary already has its own dedicated Practice Test column now, so its
       stat row leads with that instead of Standards mastered \u2014 Detail is
       where standards mastery belongs. TSI only; Algebra 1 has no test. */
    var thirdCard = (view === 'summary' && subject === 'tsi')
      ? {n: testsCount, l: 'Practice tests completed'}
      : {n: masteredSum, l: 'Standards mastered (total)'};
    cards = [
      {n:n, l:'Students shown'},
      {n:n ? Math.round(progSum/n*100)+'%' : '\u2014', l:'Avg. progress'},
      thirdCard,
      {n:totalAttempts, l:'Total attempts'}
    ];
    $('#statRow').innerHTML = cards.map(function(c){
      return '<div class="statCard"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div></div>';
    }).join('');
  }

  function render(){
    if (!hasChosen()){
      $('#statCardWrap').style.display = 'none';
      $('#tableWrap').style.display = 'none';
      $('#warnBanner').innerHTML = '';
      $('#viewCaption').innerHTML = '';
      $('#detailModeSwitch').style.display = 'none';
      $('#stateArea').innerHTML = '<div class="chooserPrompt">'+
        '<h2>Search for a student, or choose a filter above</h2>'+
        '<p>Type a name or ID, or pick a Teacher, Class period, or a "Show" option to load students.</p>'+
      '</div>';
      return;
    }
    $('#statCardWrap').style.display = '';
    $('#tableWrap').style.display = '';
    $('#stateArea').innerHTML = '';

    var students = filteredStudents();
    renderStats(students);
    $('#viewCaption').innerHTML = VIEW_CAPTIONS[view];

    var badCount = students.filter(function(s){ return s.parseError; }).length;
    $('#warnBanner').innerHTML = badCount
      ? '<div class="warnBanner">'+badCount+' student record'+(badCount===1?'':'s')+' couldn\u2019t be read (corrupted saved data) \u2014 showing as zero progress until re-synced.</div>'
      : '';

    $('#detailModeSwitch').style.display = (view === 'detail') ? '' : 'none';

    var cols = view === 'summary' ? summaryCols()
             : view === 'crc' ? CRC_COLS
             : detailGrouped ? GROUPED_DETAIL_COLS
             : DETAIL_COLS;
    var st = sortState[view];
    var colDef = cols.filter(function(c){ return c.key === st.key; })[0] || cols[0];

    $('#repHead').innerHTML = renderHead(cols, st.key, st.dir, (view==='summary' || view==='crc' || (view==='detail' && detailGrouped)) ? '<th class="expandHead"></th>' : '');
    if (view === 'summary'){
      var rows = sortRows(students.slice(), st.dir, colDef.get);
      $('#repRows').innerHTML = renderSummaryRows(rows);
    } else if (view === 'crc'){
      var crows = sortRows(students.slice(), st.dir, colDef.get);
      $('#repRows').innerHTML = renderCrcRows(crows);
    } else if (detailGrouped){
      var grows = sortRows(groupedDetailRows(students), st.dir, colDef.get);
      $('#repRows').innerHTML = renderGroupedDetailRows(grows);
    } else {
      var drows = sortRows(flattenDetail(students), st.dir, colDef.get);
      $('#repRows').innerHTML = renderDetailRows(drows);
    }
  }

  function renderAll(){
    $('#filterCard').style.display = '';
    $('#statCardWrap').style.display = '';
    $('#tableWrap').style.display = '';
    $('#stateArea').innerHTML = '';
    var teacherCount = Object.keys(optionCounts('teacher')).length;
    var classCount = Object.keys(optionCounts('klass')).length;
    $('#pillsRow').innerHTML =
      '<span class="pill">Students <b>'+raw.length+'</b></span>'+
      '<span class="pill">Teachers <b>'+teacherCount+'</b></span>'+
      '<span class="pill">Class periods <b>'+classCount+'</b></span>';
    render();
  }

  /* ---------------- CSV export (Detail grain, respects current filters) ---------------- */

  function csvEscape(v){ var s = (v==null) ? '' : String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }

  /* Practice-test export. One row per student, matching what the view shows.
     score_is_estimate flags rows where the exact score was lost before the
     Apps Script fix and only the 1-5 band survived. */
  function downloadCrcCSV(){
    var rows = filteredStudents().filter(function(s){ return !!s.crc; });
    var headers = ['student_name','student_id','teacher','class_period','status',
      'tests_taken','tests_at_or_above_950','score','score_is_estimate',
      'raw_correct','raw_items','counts_may_include_unfinished',
      'AR','QR','PSR','GSR','weakest_strand','last_test'];
    var lines = [headers.map(csvEscape).join(',')];
    rows.forEach(function(s){
      var x = s.crc;
      var cell = function(k){ return x.strands[k] ? x.strands[k].c+'/'+x.strands[k].n : ''; };
      lines.push([
        s.name, s.id, s.teacher, s.klass,
        x.taken ? 'Completed' : (x.open ? 'In progress ('+x.open.answered+'/20)' : 'No finished test'),
        x.taken || 0, x.taken ? x.passed : '',
        x.exact != null ? x.exact : (x.lo != null ? x.lo+'-'+x.hi : ''),
        x.exact != null ? 'no' : (x.lo != null ? 'yes' : ''),
        x.correct, x.items, x.estimated ? 'yes' : 'no',
        cell('AR'), cell('QR'), cell('PSR'), cell('GSR'),
        x.weakest ? x.weakest.key : '', fmtDate(x.last)
      ].map(csvEscape).join(','));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tsi_practice_tests.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }
  function downloadCSV(){
    if (view === 'crc') return downloadCrcCSV();
    var rows = flattenDetail(filteredStudents());
    var headers = ['student_name','student_id','teacher','class_period','standard','standard_name',
      'attempts','correct','overall_accuracy','recent_10_accuracy','hints','level','last_active','status'];
    var lines = [headers.map(csvEscape).join(',')];
    rows.forEach(function(r){
      lines.push([
        r.name, r.id, r.teacher, r.klass, r.stdCode, r.stdName,
        r.st.attempts, r.st.correct,
        r.st.attempts ? (r.st.correct/r.st.attempts).toFixed(4) : '',
        r.st.attempts ? r.st.recentAcc.toFixed(4) : '',
        r.st.hints, r.st.level||1, fmtDate(r.st.last),
        r.st.mastered ? 'Mastered' : 'In progress'
      ].map(csvEscape).join(','));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'teacher_report_'+subject+'_'+fmtDate(Date.now())+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  }

  /* ---------------- fetch / states ---------------- */

  function showState(html, isErr){
    $('#filterCard').style.display = 'none';
    $('#statCardWrap').style.display = 'none';
    $('#tableWrap').style.display = 'none';
    $('#warnBanner').innerHTML = '';
    $('#stateArea').innerHTML = '<div class="state'+(isErr?' err':'')+'">'+html+'</div>';
  }
  /* Retries with backoff and cache-busts every attempt (cache:'no-store' plus
     a unique _ts param) before giving up. Two real failure modes look
     identical from here \u2014 a transient Apps Script error under concurrent
     load (common at morning peak usage), and a caching layer between the
     browser and Google (a school's content-filtering proxy, or the browser
     itself) serving back a stale bad response to everyone hitting this same
     URL \u2014 and both are fixed the same way: never let it be the same request
     twice, and don't treat one failure as final. */
  function fetchReport(portalKey, attempt){
    portalKey = portalKey || subject;
    attempt = attempt || 1;
    if (!REPORT_URL || REPORT_URL.indexOf('PASTE_') === 0){
      showState('<h3>Not connected yet</h3>Paste the same Apps Script URL used for SYNC_URL in portal.js into the REPORT_URL constant near the top of this page\u2019s script \u2014 the report reuses that deployment\u2019s doGet with a ?report=all param (see Code.gs).', true);
      return;
    }
    var MAX_ATTEMPTS = 4;
    showState('Loading ' + PORTALS[portalKey].label + ' report\u2026' + (attempt > 1 ? ' (retry ' + (attempt - 1) + '/' + (MAX_ATTEMPTS - 1) + ')' : ''));
    var url = REPORT_URL + (REPORT_URL.indexOf('?')===-1 ? '?' : '&') + 'report=all&portal=' + encodeURIComponent(portalKey) + '&_ts=' + Date.now();
    fetch(url, { cache: 'no-store' })
      .then(function(r){
        return r.text().then(function(text){
          var res;
          try { res = JSON.parse(text); }
          catch (e) { throw new Error('server sent back ' + (r.headers.get('content-type') || 'unknown content') + ' instead of JSON \u2014 starts with "' + esc(text.slice(0, 40)) + '"'); }
          return res;
        });
      })
      .then(function(res){
        if (!res || !res.ok){
          showState('<h3>Couldn\u2019t load the report</h3>'+esc((res && res.error) || 'Unknown error')+'. Check the Apps Script has the report=all addition (and the '+esc(PORTALS[portalKey].label)+' tab exists) and was redeployed as a new version.', true);
          return;
        }
        loadStudents(portalKey, res.students || []);
      })
      .catch(function(err){
        if (attempt < MAX_ATTEMPTS){
          setTimeout(function(){ fetchReport(portalKey, attempt + 1); }, attempt * 1200);
          return;
        }
        showState('<h3>Couldn\u2019t reach the report after ' + MAX_ATTEMPTS + ' tries</h3>' +
          'This means Google\u2019s Apps Script deployment itself is failing or overloaded right now \u2014 not a caching problem, since every retry used a fresh, unique request. ' +
          'Open the Apps Script project \u2192 <b>Executions</b> (left sidebar) and look at what happened during this time; that log shows the real error. ' +
          'A brief wait and reload also often clears it, since Apps Script throttles a deployment under heavy simultaneous use (e.g. many students syncing at once).<br>('+esc(err)+')', true);
      });
  }

  /* Delete one item — a single skill's data or a single CRC test-log entry
     — for one student. Mirrors portal.js's own sync POST exactly (same
     URL, same text/plain content-type to avoid a CORS preflight) so this
     reuses a request shape already proven to work cross-origin against
     this exact Apps Script deployment. On success, updates the already-
     fetched in-memory copy directly (no network round trip) so the row
     disappears immediately instead of waiting on a full report refetch. */
  function postClearItem(kind, studentId, key, onDone){
    fetch(REPORT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'clearItem', portal:subject, id:studentId, kind:kind, key:key })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (res && res.ok) { onDone(); }
        else { alert('Couldn’t delete that — '+((res && res.error) || 'unknown error')+'. Refresh and try again.'); }
      })
      .catch(function(err){ alert('Couldn’t reach the server to delete that. ('+err+')'); });
  }

  /* ---------------- wiring ---------------- */

  $('#refreshBtn').addEventListener('click', function(){ fetchReport(subject); });
  $('#csvBtn').addEventListener('click', downloadCSV);
  $('#qInput').addEventListener('input', render);
  $('#teacherSel').addEventListener('change', render);
  $('#classSel').addEventListener('change', render);
  $('#activitySel').addEventListener('change', render);
  document.querySelectorAll('#subjectSwitch .viewBtn').forEach(function(b){
    b.addEventListener('click', function(){
      var next = b.getAttribute('data-subject');
      if (next === subject) return;
      subject = next;
      document.querySelectorAll('#subjectSwitch .viewBtn').forEach(function(x){ x.classList.toggle('is-active', x===b); });
      expandedIds = {};   // per-standard ids differ across subjects; collapse any open detail rows
      syncCrcTab();
      if (studentsBySubject[subject]){
        // Already fetched this tab this session — swap in the cache, no network round trip.
        raw = studentsBySubject[subject];
        recomputeOverall();
        buildFilterOptions();
        renderAll();
      } else {
        fetchReport(subject);
      }
    });
  });
  /* The practice test is a TSI feature; hide its tab on Algebra 1 and fall
     back to Summary if it was the active view when the subject changed. */
  function syncCrcTab(){
    var isTsi = (subject === 'tsi');
    $('#crcTab').style.display = isTsi ? '' : 'none';
    if (!isTsi && view === 'crc'){
      view = 'summary';
      document.querySelectorAll('.viewBtn[data-view]').forEach(function(x){
        x.classList.toggle('is-active', x.getAttribute('data-view') === 'summary');
      });
    }
  }

  document.querySelectorAll('.viewBtn[data-view]').forEach(function(b){
    b.addEventListener('click', function(){
      view = b.getAttribute('data-view');
      document.querySelectorAll('.viewBtn[data-view]').forEach(function(x){ x.classList.toggle('is-active', x===b); });
      render();
    });
  });
  document.querySelectorAll('#detailModeSwitch .viewBtn').forEach(function(b){
    b.addEventListener('click', function(){
      detailGrouped = (b.getAttribute('data-detail-mode') === 'grouped');
      document.querySelectorAll('#detailModeSwitch .viewBtn').forEach(function(x){ x.classList.toggle('is-active', x===b); });
      render();
    });
  });
  document.addEventListener('click', function(e){
    var copyBtn = e.target.closest('.copyCodeBtn');
    if (copyBtn){
      var code = copyBtn.getAttribute('data-code') || '';
      var showCopied = function(){
        var prev = copyBtn.textContent;
        copyBtn.textContent = 'Copied';
        setTimeout(function(){ copyBtn.textContent = prev; }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(showCopied, showCopied);
      } else {
        showCopied();
      }
      return;
    }
    var expandBtn = e.target.closest('.expandBtn');
    if (expandBtn){
      var sid = expandBtn.getAttribute('data-id');
      if (expandedIds[sid]) delete expandedIds[sid]; else expandedIds[sid] = true;
      render();
      return;
    }
    var clearBtn = e.target.closest('.clearItemBtn');
    if (clearBtn){
      var studentId = clearBtn.getAttribute('data-student');
      var kind = clearBtn.getAttribute('data-kind');
      var key = clearBtn.getAttribute('data-key');
      var label = clearBtn.getAttribute('data-label') || key;
      if (!confirm('Delete '+label+' for student '+studentId+'? This cannot be undone.')) return;
      clearBtn.disabled = true;
      postClearItem(kind, studentId, key, function(){
        var s = raw.filter(function(x){ return x.id === studentId; })[0];
        if (s && s.d){
          if (kind === 'skill' && s.d.skills) delete s.d.skills[key];
          if (kind === 'test' && s.d.tests) s.d.tests = s.d.tests.filter(function(t){ return String(t.t) !== String(key); });
          recomputeOverall();
        }
        render();
      });
      return;
    }
    var th = e.target.closest('th[data-key]'); if (!th) return;
    var key = th.getAttribute('data-key');
    var st = sortState[view];
    if (st.key === key) st.dir = -st.dir; else { st.key = key; st.dir = 1; }
    render();
  });

  fetchReport();
})();
</script>
</body>
